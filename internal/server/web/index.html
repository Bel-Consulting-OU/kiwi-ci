<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Kiwi CI — Execution, with evidence.">
<meta name="theme-color" content="#08110C">
<title>Kiwi CI</title>
<link rel="icon" href="/static/favicon.png" type="image/png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <a class="brand-lockup" href="/" aria-label="Kiwi CI">
    <!-- Primary lockup artwork from docs/brand/Kiwi_CI_Visual_Identity.pdf.
         Do not redraw or retype the wordmark. -->
    <img class="mark" src="/static/logo-lockup-dark.png" width="172" height="37" alt="kiwi CI">
    <div class="brand-tagline">Execution, with evidence.</div>
  </a>
  <div class="subtitle">control plane</div>
  <div class="spacer"></div>
  <span id="conn" class="pill hidden">offline</span>
  <form id="login" class="login">
    <input id="token" type="password" name="token" placeholder="admin token" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <button id="logout" class="hidden">Sign out</button>
</header>
<main>
  <section id="stats" class="stats"></section>
  <section class="toolbar">
    <h1>Runs</h1>
    <span id="paused" class="pill paused hidden">live updates paused (viewing history)</span>
    <button id="refresh">Refresh</button>
  </section>
  <div id="error" class="error hidden"></div>
  <table id="runs">
    <thead>
      <tr>
        <th>ID</th>
        <th>Status</th>
        <th>Event</th>
        <th>Repository</th>
        <th>Trusted</th>
        <th>Age</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <section id="detail" class="hidden">
    <div class="toolbar"><h1>Jobs</h1><span id="run-note" class="note hidden"></span></div>
    <table id="jobs">
      <thead>
        <tr><th>ID</th><th>Key</th><th>Status</th><th>Attempts</th><th>Runner</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
