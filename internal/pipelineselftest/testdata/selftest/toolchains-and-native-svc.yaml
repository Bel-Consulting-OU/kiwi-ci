version: 1
name: selftest-hermetic
on:
  push: {}
toolchains:
  go:
    version: "go1."
    command: ["go", "version"]
jobs:
  live:
    runtime: native
    toolchains: [go]
    services:
      - name: echo
        native: true
        command: ["python3", "-c", "import socket,time; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1); s.bind(('127.0.0.1',6405)); s.listen(1); time.sleep(30)"]
        ready: "tcp:6405"
    steps:
      - run: "echo $KIWI_SERVICE_ECHO_HOST"
