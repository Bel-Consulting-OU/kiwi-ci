# secrets: repo/org secret references. `secrets: [name]` becomes a Kiwi step
# secret declaration (value arrives as KIWI_SECRET_*); environment
# `from_secret` aliases are reported (the alias env name is not preserved).
# Plugin steps with settings have no Kiwi equivalent and become disabled
# placeholders. Secret scope and registry credentials are project settings,
# not workflow YAML.
steps:
  deploy:
    image: alpine:3.20
    secrets: [deploy_token]
    environment:
      DB_PASSWORD:
        from_secret: db_password
      STAGE: production
    commands:
      - ./deploy.sh
  publish:
    image: plugins/docker
    settings:
      repo: example/app
      tags: latest
    secrets: [docker_password]
