\* TLC configuration for formal/kiwi_lease.tla.
\*
\* Usage (Java 11+):
\*   java -jar tla2tools.jar -config formal/kiwi_lease.cfg formal/kiwi_lease.tla
\*
\* The constants below instantiate the bounded model; see the instance comment
\* and the exhaustibility note under SPECIFICATION before raising them.
SPECIFICATION Spec

\* The shipped instance is deliberately small so TLC can exhaust it in well
\* under a minute: 1 job x 2 runners x 4 generations (0..3). The refusal
\* ledger is a record SET, so the state space is exponential in
\* |Jobs| x |Runners| x (MaxGen+1) x |Outcomes|; doubling any bound roughly
\* squares the work (a 2-job x MaxGen-2 instance did not finish in minutes).
\* That is a deliberate limit, not a claim that larger instances are
\* equivalent.
CONSTANTS
    Jobs = {"job-a"}
    Runners = {"runner-1", "runner-2"}
    MaxGen = 3

\* State-predicate invariants.
INVARIANT TypeOK
INVARIANT NoTwoWinners
INVARIANT StaleOwnerCannotCommit
INVARIANT OneCommitPerGeneration

\* Temporal safety properties. TLC checks these in property-checking mode
\* (safety formulas need no fairness assumption).
PROPERTY TerminalityMonotonic
PROPERTY CancelCannotResurrect

\* Reproducible exploration.
CHECK_DEADLOCK FALSE
