# PostgreSQL integration + coverage in ONE workflow: the unit profile and the
# integration profile must share a workspace for the merge, and files are
# shared within a workflow, not between workflows.
#
# Server requirement (documented, must be configured on the Woodpecker
# instance): WOODPECKER_FORCE_IGNORE_SERVICE_FAILURE=false, so a dead
# PostgreSQL service FAILS the pipeline instead of being ignored.
labels:
  platform: linux/amd64

when:
  - event: [push, pull_request, manual, tag]

services:
  postgres:
    image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
    environment:
      POSTGRES_PASSWORD: pass

steps:
  integration-postgres:
    image: golang:1.27@sha256:f44f6e88636cfb311f9ebace870ded69d943f227bb3cb27d32ffd84ea18c43ea
    environment:
      GOTOOLCHAIN: auto
      # PostgreSQL's LLVM JIT segfaults a backend mid-query under this workload
      # on some hosts/kernels: a backend running the test-history identity
      # query dies while concurrent DROP DATABASE ... WITH (FORCE) barriers
      # wait on it, dropping the whole service into recovery mode and cascading
      # every later integration test into failure. JIT is an execution
      # optimization, not semantics, so pinning it off for the CI database is
      # a stability fix, not a coverage reduction. PGOPTIONS is honored by
      # pgx and applies to every connection the harness opens, clone DSNs
      # included, regardless of how they are derived.
      PGOPTIONS: "-c jit=off"
    commands:
      # First command of the first step: exact toolchain assertion (go.mod
      # vs README.md vs the running `go`) before the service wait or any test.
      - ./scripts/toolchain-check.sh
      - |
        ready=0
        for i in $(seq 1 30); do
          if go run ./scripts/wait-for-tcp.go postgres 5432; then
            ready=1
            break
          fi
          sleep 2
        done
        if [ "$ready" != "1" ]; then
          echo "integration-coverage: PostgreSQL on postgres:5432 never became reachable after 60s; failing the step instead of proceeding" >&2
          exit 1
        fi
      # -coverpkg=./... instruments cross-package production paths (e.g.
      # internal/pipeline, internal/safefs, internal/forge) that the
      # integration tests reach through the tested packages; dropping it
      # silently narrows the profile and the merged floor measures less than
      # it claims. scripts/ci-coverage-selftest.sh enforces its presence.
      - KIWI_TEST_POSTGRES_URL=postgres://postgres:pass@postgres:5432/postgres?sslmode=disable go test -count=1 -timeout=45m -v -run Integration -coverprofile=integration-coverage.out -covermode=atomic -coverpkg=./... ./internal/storage ./internal/scheduler ./internal/server ./internal/app

  # Root guards: os.Geteuid()==0 permission-failure tests skip under the root
  # lanes, so this step runs the WHOLE unit suite as an unprivileged user and
  # writes a coverage profile too. The root coverage step cannot see those
  # tests, and discarding this profile made the merged 95% floor understate
  # real coverage (and made the instrumented suite's own root-skipping tests
  # count as uncovered). See .woodpecker/linux-amd64.yml unit-nonroot for the
  # cache-ownership rationale (workspace is 0777; caches live under /tmp).
  unit-nonroot:
    image: golang:1.27@sha256:f44f6e88636cfb311f9ebace870ded69d943f227bb3cb27d32ffd84ea18c43ea
    backend_options:
      docker:
        user: "65534:65534"
    environment:
      GOTOOLCHAIN: auto
      HOME: /tmp
      GOCACHE: /tmp/gocache
      GOPATH: /tmp/gopath
      GOMODCACHE: /tmp/gopath/pkg/mod
      GOTMPDIR: /tmp
    commands:
      - env -u KIWI_TEST_POSTGRES_URL go test -count=1 -shuffle=on -timeout=45m -coverprofile=unit-nonroot.out -covermode=atomic ./...

  coverage:
    image: golang:1.27@sha256:f44f6e88636cfb311f9ebace870ded69d943f227bb3cb27d32ffd84ea18c43ea
    depends_on: [integration-postgres, unit-nonroot]
    environment:
      GOTOOLCHAIN: auto
      KC_MIN_COVERAGE: "95"
    commands:
      # Unit profile: KIWI_TEST_POSTGRES_URL is explicitly unset so every
      # PostgreSQL-gated test skips here and lands in integration-coverage.out
      # (produced by the integration-postgres step, which sets the DSN) where
      # -coverpkg=./... instruments it. An inherited job/agent DSN would
      # silently split the integration suite across both profiles.
      - env -u KIWI_TEST_POSTGRES_URL go test -timeout=45m -coverprofile=coverage.out -covermode=atomic ./...
      - ./scripts/ci-coverage-selftest.sh coverage.out integration-coverage.out unit-nonroot.out
      - ./scripts/merge-coverage.sh merged-coverage.out coverage.out integration-coverage.out unit-nonroot.out
      - ./scripts/coverage-report.sh merged-coverage.out
      - ./scripts/coverage-floor.sh merged-coverage.out
      - ./scripts/coverage-package-floor.sh merged-coverage.out
