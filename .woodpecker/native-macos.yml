# Native macOS arm64: unit + race + the termios/Tart-sensitive packages.
#
# ===========================================================================
# SECURITY - LOCAL BACKEND, NO ISOLATION
# This workflow runs on Woodpecker's local backend, which executes the
# commands below directly on the worker host, as the same user as the agent,
# with no container boundary. Treat the worker as fully exposed to whatever
# the checkout contains:
#   - run it only on one-shot/ephemeral, disposable hosts that are destroyed
#     or reimaged after every run; never reuse a long-lived interactive host;
#   - run the agent as a dedicated low-privilege user (never root) whose only
#     durable state is the Go toolchain and the per-run checkout;
#   - keep no persistent credentials on the host: no release signing keys, no
#     forge tokens, no cloud/SSH keys. The only secret that may exist is the
#     Woodpecker agent secret, and it is scoped to this agent and rotated;
#   - NEVER run untrusted code here. `when` is restricted to push/manual/tag,
#     which are trusted events for this repository: only users with write
#     access can push, create tags, or trigger a manual run, and a fork pull
#     request never produces events in this repository. Do not add
#     pull_request/pull_request_* events to this file; fork heads would then
#     execute on the host. PR coverage belongs to the Docker-backend lanes.
# ===========================================================================
#
# Agent selection and shell:
#   - Woodpecker's local backend advertises the default labels
#     platform=<GOOS>/<GOARCH> (canonical slash form) and backend=local;
#     selecting both pins this workflow to the dedicated macOS host (docs:
#     workflow syntax -> labels; agent configuration -> AGENT_LABELS).
#   - On the local backend `image` is the shell/executable, not a container
#     image (docs: backends -> local -> "Shell"), so it is `bash` here.
#
# Clone path (local backend): the automatic clone step is the plugin-git
# binary, and the docs state it "must be in your $PATH for the default clone
# step to work. If this is not the case, you can still write a manual clone
# step." (docs: workflow syntax -> `clone`). This worker does not guarantee
# plugin-git, so the documented fallback is used: `skip_clone: true` (docs:
# workflow syntax -> `skip_clone`) disables the plugin clone, and the
# `checkout` step below clones and checks out the Woodpecker-provided revision
# itself. The local backend already creates the workspace (`CI_WORKSPACE`)
# before the first step and runs every command with it as the working
# directory (docs: usage -> environment -> `CI_WORKSPACE`; local backend docs:
# "The local backend will use a random directory in $TMPDIR to store the
# cloned code"). The commands use the built-in commit variables
# CI_REPO_CLONE_URL, CI_COMMIT_REF and CI_COMMIT_SHA, so push, manual and tag
# events all check out the exact commit, and the result is verified before any
# other step runs.
#
# Toolchain: the `toolchain` step reads the exact `go <version>` directive
# from the checked-out go.mod and compares it against README.md and the
# worker's `go version` via scripts/toolchain-check.sh. This replaces the old
# loose `1.27.x` regex. GOTOOLCHAIN=local stops Go from downloading a
# different toolchain to mask a stale worker.
labels:
  platform: darwin/arm64
  backend: local

when:
  - event: [push, manual, tag]

skip_clone: true

steps:
  checkout:
    image: bash
    environment:
      GOTOOLCHAIN: local
    commands:
      - |
        set -eu
        git -C "$CI_WORKSPACE" init -q
        git -C "$CI_WORKSPACE" remote add origin "$CI_REPO_CLONE_URL"
        git -C "$CI_WORKSPACE" fetch -q --force origin "$CI_COMMIT_REF"
        git -C "$CI_WORKSPACE" checkout -q --detach "$CI_COMMIT_SHA"
        test "$(git -C "$CI_WORKSPACE" rev-parse HEAD)" = "$CI_COMMIT_SHA"

  toolchain:
    image: bash
    depends_on: [checkout]
    environment:
      GOTOOLCHAIN: local
    commands:
      # Exact toolchain assertion (go.mod vs README.md vs running `go`).
      - ./scripts/toolchain-check.sh

  unit:
    image: bash
    depends_on: [toolchain]
    environment:
      GOTOOLCHAIN: local
    commands:
      - go test -shuffle=on -timeout=20m ./...

  race:
    image: bash
    depends_on: [unit]
    environment:
      GOTOOLCHAIN: local
    commands:
      - go test -race -shuffle=on -timeout=30m ./internal/tui ./internal/executor ./internal/safefs ./internal/server ./internal/storage

  platform-packages:
    image: bash
    depends_on: [unit]
    environment:
      GOTOOLCHAIN: local
    commands:
      - go test -count=1 -v -timeout=30m ./internal/tui ./internal/safefs ./internal/workspace ./internal/executor
