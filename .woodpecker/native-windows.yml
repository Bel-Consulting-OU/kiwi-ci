# Native Windows amd64: real platform execution (cross-compilation is not
# platform testing).
#
# ===========================================================================
# SECURITY - LOCAL BACKEND, NO ISOLATION
# This workflow runs on Woodpecker's local backend, which executes the
# commands below directly on the worker host, as the same user as the agent,
# with no container boundary. Treat the worker as fully exposed to whatever
# the checkout contains:
#   - run it only on one-shot/ephemeral, disposable hosts that are destroyed
#     or reimaged after every run; never reuse a long-lived interactive host;
#   - run the agent as a dedicated low-privilege user (never an administrator)
#     whose only durable state is the Go toolchain and the per-run checkout;
#   - keep no persistent credentials on the host: no release signing keys, no
#     forge tokens, no cloud/SSH keys. The only secret that may exist is the
#     Woodpecker agent secret, and it is scoped to this agent and rotated;
#   - NEVER run untrusted code here. `when` is restricted to push/manual/tag,
#     which are trusted events for this repository: only users with write
#     access can push, create tags, or trigger a manual run, and a fork pull
#     request never produces events in this repository. Do not add
#     pull_request/pull_request_* events to this file; fork heads would then
#     execute on the host. PR coverage belongs to the Docker-backend lanes.
# ===========================================================================
#
# Agent selection and shell:
#   - Woodpecker's local backend advertises the default labels
#     platform=<GOOS>/<GOARCH> and backend=local; selecting both pins this
#     workflow to the dedicated Windows host (docs: workflow syntax ->
#     labels; agent configuration -> AGENT_LABELS).
#   - On the local backend `image` is the shell/executable, not a container
#     image (docs: backends -> local -> "Shell"). Upstream supports both
#     `pwsh` and `powershell` (pipeline/backend/local/command.go); `pwsh`
#     (PowerShell 7+) is used here and must be on the worker's PATH.
#   - The worker must provide Go 1.27.x: the toolchain step asserts
#     `go version`, and GOTOOLCHAIN=local stops Go from downloading another
#     toolchain to mask a stale worker.
labels:
  platform: windows/amd64
  backend: local

when:
  - event: [push, manual, tag]

steps:
  toolchain:
    image: pwsh
    environment:
      GOTOOLCHAIN: local
    commands:
      - '$gv = (go version); if ($gv -notmatch ''go1\.27(\.\d+)?'') { Write-Error "native-windows requires Go 1.27.x on the worker, got: $gv"; exit 1 }; Write-Host "go toolchain: $gv"'

  unit:
    image: pwsh
    depends_on: [toolchain]
    environment:
      GOTOOLCHAIN: local
    commands:
      - go vet ./...
      - go test -shuffle=on -timeout=20m ./...

  platform-packages:
    image: pwsh
    depends_on: [unit]
    environment:
      GOTOOLCHAIN: local
    commands:
      # The packages whose behavior differs most on Windows: filesystem,
      # terminal, path handling, process supervision and secrets key files.
      - go test -count=1 -v -timeout=30m ./internal/safefs ./internal/tui ./internal/executor ./internal/runner ./internal/storage ./internal/workspace ./internal/config
