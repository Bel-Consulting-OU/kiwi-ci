# NON-BLOCKING DIAGNOSTIC: the rootless/hardened workspace invariant had a
# production bug, so this job still exercises it wherever a compatible agent
# exists — but it is deliberately NOT a required push status. Woodpecker's
# docker backend mounts the pipeline workspace as a NAMED VOLUME, so the
# test's own-workspace bind mounts (docker run -v <test temp dir>) resolve on
# the daemon host where that path does not exist; and a daemon-local agent
# with the local backend cannot run this lane either, because the local
# backend uses step.Image as the executable for command steps. The lane is
# therefore impossible on the current Woodpecker topology (see commit
# 6d2138e), and an intentionally impossible required lane makes every HEAD
# red and trains maintainers to ignore red CI. Until a compatible
# runner/backend (or a rewritten bind-mount-free invariant test) exists, this
# job reports instead of gating:
#
#   - both steps carry `failure: ignore`, so a failure here never fails the
#     push pipeline;
#   - a missing/unusable Docker daemon is reported and skipped with exit 0;
#   - a workspace NOT visible to the daemon (the documented named-volume vs
#     daemon-host path mismatch) is detected before the test runs and skipped
#     with an explicit diagnostic message;
#   - the invariant test itself only fails the step (still non-blocking) when
#     the environment is capable and the invariant genuinely breaks.
#
# When a compatible backend or a rewritten lane exists, promote the
# replacement to a required push context in scripts/gh-branch-protection.sh
# (PUSH_CONTEXTS).
#
# Agent labels: `platform: linux/amd64` is the canonical GOOS/GOARCH form of
# the built-in `platform=<GOOS>/<GOARCH>` agent label (docs: workflow syntax
# -> labels). `capability: docker` only SELECTS an agent; it injects nothing,
# so the daemon socket is mounted explicitly below.
#
# Docker access and trust: both steps below mount the agent host's socket
# (`volumes: - /var/run/docker.sock:/var/run/docker.sock`, the exact mount
# shown in docs: usage -> volumes). Host-path volumes are only accepted when
# the repository is marked TRUSTED in Woodpecker (project settings -> trusted;
# docs: usage -> volumes: "Volumes are only available to trusted repositories
# and for security reasons should only be used in private environments").
# TRUST REQUIREMENT: this lane therefore requires a trusted repository, and
# it runs on a dedicated agent whose daemon is the one the lane may touch.
#
# TRUSTED EVENTS ONLY: Woodpecker gates host volumes on the repository-level
# Trusted flag alone -- there is no per-event or fork gating -- so a
# `pull_request` run of this workflow would execute PR-authored
# Dockerfile/Go code with control of the agent host's Docker daemon, which
# is equivalent to host root. The `when` below therefore excludes
# `pull_request` (and every `pull_request_*` variant): this lane runs on
# push/manual/tag only. Re-gating pull requests requires a socket-less
# variant of this lane; `capability: docker` only selects an agent and
# injects nothing. internal/workflowguard fails any workflow that declares a
# host volume and still lists `pull_request`.
#
# Alternative for a dedicated agent that mounts the socket everywhere:
#   WOODPECKER_BACKEND_DOCKER_VOLUMES=/var/run/docker.sock:/var/run/docker.sock
# (docs: docker backend -> BACKEND_DOCKER_VOLUMES, "List of default volumes
# separated by comma to be mounted to all pipeline containers"). The
# per-workflow mount is preferred: the requirement stays visible with the
# lane instead of being an undocumented agent setting.
#
# Self-contained image: golang:1.27 does not guarantee a Docker CLI, so the
# lane builds its own test image from ci/image/Dockerfile on the
# agent's daemon and runs the diagnostic step in it. Nothing has to be
# published to or pulled from a registry for kiwi-ci-test.
#
# `pull` is a boolean step option in the Woodpecker schema (no "never" value);
# `pull: false` is the documented "do not force a pull" setting. The image is
# already present on the daemon after the build step, so the test step runs
# the locally built layers.
labels:
  platform: linux/amd64
  capability: docker

when:
  # Trusted events only: the steps below mount /var/run/docker.sock (see the
  # trust rationale in the header), so a pull_request run would hand
  # PR-authored code control of the host daemon.
  - event: [push, manual, tag]

steps:
  build-ci-image:
    image: docker:cli@sha256:018edbc908e08fcc9dbf029c812c34251e9b4719e6f71ca0e5eae2a987d014ca
    pull: false
    # Non-blocking diagnostic: an unavailable daemon or a failed build is
    # reported, never a push gate.
    failure: ignore
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |
        if ! docker info >/dev/null 2>&1; then
          echo "docker-workspace diagnostic (non-blocking): no usable Docker daemon on this agent (socket missing or permission denied); the invariant is NOT exercised here" >&2
          docker info >&2 || true
          exit 0
        fi
        docker build -f ci/image/Dockerfile -t kiwi-ci-test:go1.27 .

  docker-workspace-diagnostic:
    image: kiwi-ci-test:go1.27
    pull: false
    depends_on: [build-ci-image]
    # Non-blocking diagnostic (see the header): this step may fail without
    # failing the push pipeline.
    failure: ignore
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      GOTOOLCHAIN: local
      KIWI_TEST_DOCKER: "1"
    commands:
      # This is the first Go-capable step: build-ci-image runs in docker:cli,
      # which carries no Go toolchain. The drift check (go.mod vs README vs
      # running toolchain) therefore asserts the exact toolchain here, before
      # any test executes.
      - ./scripts/toolchain-check.sh
      - |
        if ! docker info >/dev/null 2>&1; then
          echo "docker-workspace diagnostic (non-blocking): no usable Docker daemon on this agent; the invariant is NOT exercised here" >&2
          docker info >&2 || true
          exit 0
        fi
        # The known topology mismatch: Woodpecker's docker backend exposes the
        # pipeline workspace as a named volume, so this path is not the same
        # path on the daemon host. Probe it before running the invariant; a
        # daemon that cannot see the workspace cannot run the test's own
        # bind mounts either.
        if ! docker run --rm -v "$PWD:/workspace" --entrypoint sh kiwi-ci-test:go1.27 -c 'test -f /workspace/go.mod' >/dev/null 2>&1; then
          echo "docker-workspace diagnostic (non-blocking): the Docker daemon cannot see the pipeline workspace at $PWD (Woodpecker docker-backend named volume vs daemon host path); the invariant cannot run on this topology" >&2
          exit 0
        fi
        go test -count=1 -v -timeout=20m -run RootlessHardenedContainerWorkspace ./internal/runner
