# Kiwi certifies Kiwi: this is the certification entry point GitHub Actions
# invokes through the product (`./kiwi run -f .kiwi/certify.yaml`), not a
# re-encoded copy of the gates in YAML that the product never sees.
#
# Unlike .kiwi/pipeline.yaml (the full self-host matrix, rootless containers,
# digest-pinned images, PostgreSQL service), this graph runs natively so a
# standard GitHub-hosted runner can execute it without a rootless daemon.
# It is still Kiwi's own engine: the jobs, needs, logs and evidence records
# all come from a real kiwi run.
#
# Gates (run texts mirror the Makefile / CI surface checks exactly):
#   quality      gofmt, go vet, go build, surface-check, filemap, docs-lint
#   proofs       dogfood-fast (model proofs) — DF0 closes the loop on itself
version: 1
name: kiwi-certify-kiwi

defaults:
  shell: bash

# No GOTOOLCHAIN=local: the host (or setup-go) must be able to resolve the
# go.mod toolchain. Forcing local breaks hosts whose base Go is older than
# the go directive (for example go1.27.0 with `go 1.27.2`). Containers in
# .kiwi/pipeline.yaml pin the image instead.

concurrency:
  group: "certify:${{ repo.full_name }}:${{ git.branch }}"
  cancel_in_progress: true

jobs:
  quality:
    runtime: native
    timeout: 15m
    steps:
      - name: gofmt
        # Use the gofmt that belongs to the same go as `go` on PATH. A bare
        # `gofmt` can resolve to a different installation (for example
        # /usr/local/go/bin/gofmt behind a homebrew go) and report files the
        # CI gofmt job never sees.
        run: |
          set -eu
          GOFMT="$(dirname "$(command -v go)")/gofmt"
          test -x "$GOFMT"
          files="$("$GOFMT" -l .)"
          if [ -n "$files" ]; then
            printf 'gofmt wants changes:\n%s\n' "$files"
            exit 1
          fi
      - name: go-vet
        run: go vet ./...
      - name: go-build
        run: go build ./...
      - name: surface-check
        run: make surface-check
      - name: filemap
        run: go run ./cmd/filemap --check
      - name: docs-lint
        run: ./scripts/docs-lint.sh --source --baseline scripts/docs-lint-baseline.txt
      - name: docs-links
        run: ./scripts/docs-links-check.sh

  unit:
    needs: [quality]
    runtime: native
    timeout: 30m
    steps:
      - name: test-unit
        run: go test -count=1 -timeout=25m ./...
      - name: test-race
        run: go test -race -count=1 -timeout=15m ./internal/server/ ./internal/storage/ ./internal/runner/ ./internal/scheduler/

  proofs:
    needs: [quality]
    runtime: native
    timeout: 20m
    steps:
      - name: dogfood-fast
        run: make dogfood-fast
      - name: certify-schema
        # The certification pipeline itself must parse with the product.
        run: go run ./cmd/kiwi validate -f .kiwi/certify.yaml
      - name: woodpecker-proof
        # Executable claim: Kiwi control plane is not slower than a
        # Woodpecker-class reference (see perf/woodpecker_compare_test.go).
        # Timing gates need a quiet machine — they are gated on KIWI_PROOF=1
        # and live only in this proofs job, not on every unit run.
        run: KIWI_PROOF=1 go test ./perf/ -count=1 -timeout=60s -run 'TestKiwi' -v
