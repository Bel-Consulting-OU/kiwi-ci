# Public capability manifest — the AUTHORITATIVE coverage contract.
#
# surfacecheck.TestCapabilityManifestCoversPublicSurface fails when:
#   - a CLI command (cmd/kiwi) or HTTP route family (server mux) is not
#     named in any capability's `covers` list;
#   - a capability covers nothing (a row with no surface is not a proof);
#   - a system/adversarial proof has no Implemented dogfood scenario;
#   - a release proof is not a Makefile release-gate --require.
#
# `covers` entries are the extracted surface ids: "cli:<command>" or
# "route:<family>". `scenarios` are DF-… ids or --require test names.
version: 1
capabilities:
  - id: cli.local
    summary: "Local pipeline run / validate / explain / init / lock"
    proofs: [unit, component]
    covers: [cli:run, cli:validate, cli:explain, cli:init, cli:lock, cli:import]
  - id: cli.ops
    summary: "Remote ops commands (runs/jobs/logs/cancel/approve/rerun/artifacts/schedules/policy)"
    proofs: [unit, component]
    covers: [cli:runs, cli:jobs, cli:logs, cli:cancel, cli:approve, cli:rerun, cli:artifacts, cli:schedules, cli:policy]
  - id: cli.identity
    summary: "login / logout / context / secret explain"
    proofs: [unit]
    covers: [cli:login, cli:logout, cli:context, cli:secret]
  - id: cli.platform
    summary: "server / runner / dispatch / up / doctor / setup / database / storage / config / tui / version"
    proofs: [unit, system]
    covers: [cli:server, cli:runner, cli:dispatch, cli:up, cli:doctor, cli:setup, cli:database, cli:storage, cli:config, cli:tui, cli:version, cli:help, cli:migrate, cli:status, cli:check, cli:outbox, cli:repair-repo-identities, cli:verify, cli:replay]
    scenarios: [DF-BOOT-001, TestSysDFBoot001]
  - id: route.runs
    summary: "Run submit/list/get/cancel/rerun/jobs/logs/artifacts/tests"
    proofs: [unit, system, release]
    covers: [route:api/v1/runs, route:api/v1/jobs, route:api/v1/artifacts, route:api/v1/test-intelligence]
    scenarios: [DF-SCALE-001, TestSysDFScale002Soak, TestSysDFVerificationProductionPath]
  - id: route.auth
    summary: "Web login/logout, OIDC discovery/JWKS, secret issuance"
    proofs: [unit, system]
    covers: [route:api/v1/login, route:api/v1/logout, route:oidc, route:api/v1/oidc]
    scenarios: [DF-EVID-005, TestSysTrustedIngress]
  - id: route.health
    summary: "Liveness, readiness, readiness/lease, version, metrics"
    proofs: [unit, system]
    covers: [route:liveness, route:readiness, route:readiness/lease, route:version, route:metrics, route:ui]
    scenarios: [DF-BOOT-001, TestSysDFBoot001]
  - id: route.forge
    summary: "Forge webhooks (GitHub/GitLab/Forgejo) and check publication"
    proofs: [unit, adversarial]
    covers: ["route:hooks/*"]
    scenarios: [DF-EVID-001, TestSysDFForgeCanary001]
  - id: route.runners
    summary: "Runner enroll/next/heartbeat/complete, profiles, drain"
    proofs: [unit, system, adversarial, release]
    covers: [route:api/v1/runners, route:api/v1/runner-profiles, route:api/v1/drain]
    scenarios: [DF-LEASE-001, DF-LEASE-002, TestSysDFLease001, TestSysDFChaos001, TestSysRootlessEnforced]
  - id: route.events
    summary: "Event stream, audit, execution snapshots"
    proofs: [unit, system]
    covers: [route:api/v1/events, route:api/v1/audit, route:api/v1/execution-snapshot]
    scenarios: [DF-EVID-001, TestSysDFEvid001]
  - id: route.schedules
    summary: "Schedule list/upsert/trigger"
    proofs: [unit, system]
    covers: [route:api/v1/schedules]
    scenarios: [DF-BOOT-001, TestSysTrustedScheduleIngress]
  - id: evidence.authority
    summary: "Claims, derived verified outcomes, acceptance MAC, portable proofs"
    proofs: [unit, system, adversarial, release]
    covers: [pkg:internal/verifyapi, pkg:internal/provenance]
    scenarios: [DF-EVID-001, DF-EVID-002, DF-EVID-003, DF-EVID-004, TestSysDFVerificationProductionPath, TestVerifyExecutionAttestationSchemaVersionError]
  - id: scheduler.lease
    summary: "Atomic lease, fencing, concurrency.limit, environment slots"
    proofs: [unit, system, adversarial]
    covers: [pkg:internal/scheduler, pkg:internal/storage]
    scenarios: [DF-LEASE-001, DF-LEASE-002, TestSysDFChaos001]
  - id: storage.durability
    summary: "Postgres/fs stores, DR restore, N-1 upgrade, HA blob topology"
    proofs: [unit, system, release]
    covers: [pkg:internal/storage, pkg:internal/blob, pkg:internal/cas]
    scenarios: [DF-UPGRADE-001, TestSysDFDr001PostgresObjectStore, TestSysDFUpgrade002NMinusOne, TestSysDFCanonicalReleaseScenario]
  - id: execution.security
    summary: "Untrusted quota, rootless, secrets, cache/artifact trust domains"
    proofs: [unit, system, adversarial]
    covers: [pkg:internal/executor, pkg:internal/secrets, pkg:internal/secretbroker]
    scenarios: [DF-QUOTA-001, DF-CACHE-001, DF-ART-001, TestSysQuotaGate, TestSysUntrustedContainerEvidenceLane]
  - id: effects.authorization
    summary: "External-effect capability: winner once, losers zero"
    proofs: [unit, system, adversarial]
    covers: [pkg:internal/deploy, pkg:internal/model]
    scenarios: [DF-EFFECT-001, DF-EFFECT-002]
  - id: pipeline.language
    summary: "Parse/validate/compile, run: shorthand, matrix, concurrency.limit, clone/workspace/volumes"
    proofs: [unit, component]
    covers: [pkg:internal/pipeline, pkg:internal/importer]
  - id: importer.woodpecker
    summary: "Woodpecker import → Kiwi equivalence mapping"
    proofs: [unit, component]
    covers: [cli:import]
  - id: selfhost.release
    summary: "Self-host G1→G2, packaged artifact, release gate before tag"
    proofs: [system, release]
    covers: [pkg:internal/dogfood, pkg:cmd/kiwi]
    scenarios: [DF-SELF-001, TestSysDFSelf002G1ToG2, TestSysDFRelease001PackagedArtifact]
