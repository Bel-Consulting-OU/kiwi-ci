name: dogfood

# Nightly lean dogfood battery (frozen scope).
#
# Model proofs (./internal/dogfood): in-memory harness/oracle — state-machine
# invariants and races. System proofs (make dogfood-system): real
# NewPersistent server + HTTP API + runner (system.System).
#
# Cloud/fleet/N-1/provider suites are OUT of the frozen acceptance contract
# and must not be re-added here. PR gate remains make dogfood-fast (ci.yml).
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Action refs are pinned to full commit SHAs (same pins as ci.yml).
jobs:
  dogfood:
    name: "${{ matrix.suite }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - local
          - system
          - adversarial
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: make dogfood-${{ matrix.suite }}
        run: make "dogfood-${{ matrix.suite }}"
