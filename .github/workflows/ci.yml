name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# All third-party actions below are pinned to full commit SHAs (resolved
# from their latest tags on 2026-09-14) so a tag move cannot inject code:
#   actions/checkout      v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-go      v7.0.0 -> b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
#   actions/cache         v6.1.0 -> 55cc8345863c7cc4c66a329aec7e433d2d1c52a9
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0 -> b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"

  vet:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0 -> b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go vet ./...

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0 -> b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go test -shuffle=on -timeout=15m ./...

  race:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0 -> b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go test -race -shuffle=on -timeout=15m ./...

  # Windows has no race detector, so the concurrent-heavy packages get a
  # high-count stress lane instead to shake out flaky parallel tests.
  stress-windows:
    runs-on: windows-latest
    steps:
      # actions/checkout v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0 -> b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Concurrent stress
        run: go test -count=10 -run 'Concurrent|Race|Parallel' ./internal/executor ./internal/server ./internal/storage ./internal/scheduler

  adversarial:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0 -> b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go test -run 'Adversarial|Security|Property|Fault|Symlink|Traversal|Tamper|Reject|Evil|Bomb' -shuffle=on ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0 -> b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: ./scripts/fuzz-smoke.sh 10s

  schema:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0 -> b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go test -run Schema ./internal/pipeline
      - run: go run ./cmd/filemap --check

  cross:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0 -> b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: make cross

  # Installs staticcheck with the repo Go toolchain (setup-go above) rather
  # than the staticcheck-action's separate Go install, so analysis uses the
  # same compiler the repo builds with. honnef.co/go/tools v0.8.1
  # (staticcheck 2026.2.1) understands the Go 1.27 export data; v0.6.1
  # cannot decode it and fails every package with import errors.
  staticcheck:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0 -> b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      # actions/cache v6.1.0 -> 55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      # Persists the module cache and the installed tool binary so the
      # analysis-time download is minimal on subsequent runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin
          key: ${{ runner.os }}-staticcheck-v0.8.1-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-staticcheck-v0.8.1-
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - name: staticcheck
        run: staticcheck ./...

  # govulncheck runs directly under the repo Go toolchain (go run with a
  # pinned module version) for toolchain consistency. golang.org/x/vuln
  # v1.8.0 is the current release line for Go 1.27.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0 -> b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      # actions/cache v6.1.0 -> 55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-govulncheck-v1.8.0-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-govulncheck-v1.8.0-
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  license:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: make license-check

  docs:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: make docs-check

  repro:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0 -> b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: ./scripts/repro-build.sh
