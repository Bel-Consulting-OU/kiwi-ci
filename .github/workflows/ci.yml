name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: surface checks
        run: |
          go run ./cmd/filemap --check
          ./scripts/docs-links-check.sh
      - name: unit tests
        run: go test -count=1 -timeout=40m ./...

  race:
    name: race (server/store/runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: race-sensitive packages
        run: go test -race -count=1 -timeout=40m ./internal/server/ ./internal/storage/ ./internal/runner/ ./internal/app/

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: fuzz smoke (5s per target)
        run: ./scripts/fuzz-smoke.sh 5s
