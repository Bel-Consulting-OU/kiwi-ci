name: ci

# Kiwi is the CI for this repository. This workflow ONLY bootstraps the `kiwi`
# binary and invokes the product. Every gate — gofmt, vet, build, surface
# checks, unit/race tests, dogfood proofs, Woodpecker performance proof —
# lives in `.kiwi/certify.yaml` and is executed by Kiwi itself.
#
# Do not re-implement tests in Actions YAML. If a gate is missing, add it to
# `.kiwi/certify.yaml` so Kiwi certifies Kiwi.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Action refs are pinned to full commit SHAs (same pins as release-gate.yml).
jobs:
  kiwi-ci:
    name: kiwi certifies kiwi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install kiwi
        run: |
          set -euo pipefail
          go build -o dist/kiwi ./cmd/kiwi
          echo "$PWD/dist" >> "$GITHUB_PATH"
          dist/kiwi version
      - name: kiwi run .kiwi/certify.yaml
        run: kiwi run -f .kiwi/certify.yaml -json

  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # actionlint 1.7.12
