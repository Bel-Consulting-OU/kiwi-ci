name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Action refs are pinned to full commit SHAs (mutable major tags are not an
# acceptable trust root for a verification product). Re-resolve with:
#   git ls-remote https://github.com/actions/<name>.git 'refs/tags/v*'
# and update the trailing tag comment together with the SHA.
jobs:
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: surface checks
        run: |
          go run ./cmd/filemap --check
          ./scripts/docs-links-check.sh
      - name: unit tests
        run: go test -count=1 -timeout=40m ./...
      - name: dogfood-fast (model proofs)
        run: make dogfood-fast

  dogfood:
    name: dogfood-evidence-lease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Independent bootstrap CI route: dogfood must run on hosted CI so a
      # broken harness or lost scenario cannot hide behind a green unit job.
      - name: evidence / lease / quota / effect contracts
        run: make dogfood-fast
      - name: suite contracts (required names present)
        run: |
          go test ./internal/dogfood/scenarios/ -count=1 -run 'TestEveryRegistry|TestMakefileRequires'

  race:
    name: race (server/store/runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: race-sensitive packages
        run: go test -race -count=1 -timeout=40m ./internal/server/ ./internal/storage/ ./internal/runner/ ./internal/app/

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: fuzz smoke (5s per target)
        run: ./scripts/fuzz-smoke.sh 5s
