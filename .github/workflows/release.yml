name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: >-
          Publish an UNSIGNED release (disaster recovery only; provenance
          signing is mandatory in every other case).
        type: boolean
        required: false
        default: false

# The release job writes binaries, SBOMs and provenance to the GitHub
# release, so contents: write is required.
permissions:
  contents: write

# Actions pinned to full commit SHAs (resolved from latest tags, 2026-09-14):
#   actions/checkout        v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-go        v7.0.0 -> b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
#   actions/cache           v6.1.0 -> 55cc8345863c7cc4c66a329aec7e433d2d1c52a9
#   actions/upload-artifact v7.0.1 -> 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   softprops/action-gh-release v3.0.3 -> efb35369e0ad2afab669f228072c1b0d510eae64
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # actions/setup-go v7.0.0 -> b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23"

      # actions/cache v6.1.0 -> 55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-release-govulncheck-v1.1.4-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-release-govulncheck-v1.1.4-

      # govulncheck is a release gate: a release with known vulnerabilities
      # is never built or published. golang.org/x/vuln v1.1.4 is the latest
      # release compatible with Go 1.23.
      - name: govulncheck release gate
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      # Signing is NOT optional. A signed release requires
      # KIWI_RELEASE_SIGNING_KEY (an Ed25519 PKCS#8 private key PEM as a
      # repository secret; generate with `openssl genpkey -algorithm ed25519`).
      # This gate fails the job when the secret is absent, so no unsigned
      # release can ever be published through the normal tag path. The only
      # escape is an explicit manual `workflow_dispatch` with
      # `allow_unsigned: true` for disaster recovery.
      - name: Fail closed on missing signing key
        if: ${{ !inputs.allow_unsigned }}
        env:
          KIWI_RELEASE_SIGNING_KEY: ${{ secrets.KIWI_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$KIWI_RELEASE_SIGNING_KEY" ]; then
            echo "::error::KIWI_RELEASE_SIGNING_KEY is required for signed releases; refusing to publish an unsigned release" >&2
            exit 1
          fi

      - name: Build release bundle
        run: ./scripts/release.sh "${{ github.ref_name }}"
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
          KIWI_RELEASE_SIGNING_KEY: ${{ secrets.KIWI_RELEASE_SIGNING_KEY }}
          # Only the explicit disaster dispatch may produce an unsigned
          # bundle; scripts/release.sh fails closed in every other case.
          KIWI_ALLOW_UNSIGNED_RELEASE: ${{ inputs.allow_unsigned && '1' || '' }}

      - name: Upload bundle artifact
        # actions/upload-artifact v7.0.1 -> 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-bundle
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        # softprops/action-gh-release v3.0.3 -> efb35369e0ad2afab669f228072c1b0d510eae64
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: dist/release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
