name: release-gate

# Causal release certification: the tag is created ONLY AFTER this workflow
# succeeds. A tag that exists before certification is a governance defect —
# this workflow's job is to make the tag the CONSEQUENCE of green evidence.
#
# Trigger: workflow_dispatch with the version to certify (e.g. v1.2.3).
# Optional: push to main runs the closure as a dry-run without tagging.
#
# Break-glass (creating a tag without this gate) must be an explicit,
# audited incident (docs/releases.md § Release governance on `main`).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to certify and tag (e.g. v1.2.3)"
        required: true
        type: string
      create_tag:
        description: "Create the git tag after certification succeeds"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  production-closure:
    name: release-gate (production dogfood closure)
    runs-on: ubuntu-latest
    services:
      # Pinned PostgreSQL for the production dist/DR/verification path.
      # DIGEST-PINNED: the release trust root must not be "whatever
      # postgres:16-alpine meant that morning". The digest matches the
      # self-host pipeline's postgres identity.
      postgres:
        image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiwi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: install PostgreSQL client tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client postgresql
          # Ubuntu ships initdb under /usr/lib/postgresql/<N>/bin, not on
          # the generic PATH. Expose the bindir explicitly.
          PG_BINDIR="$(pg_config --bindir)"
          echo "PG_BINDIR=$PG_BINDIR" >> "$GITHUB_ENV"
          echo "$PG_BINDIR" >> "$GITHUB_PATH"
          "$PG_BINDIR/initdb" --version
          "$PG_BINDIR/pg_dump" --version
          "$PG_BINDIR/pg_restore" --version
          psql --version
      - name: release-gate
        env:
          # Production dist/DR tests connect to the pinned service. The
          # in-test initdb path is used when KIWI_TEST_POSTGRES_URL is unset;
          # pointing at the service exercises the same code without relying
          # on whatever the runner image happens to carry.
          KIWI_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          # Hermetic: no api.github.com from inside the certification chain.
          KIWI_ALLOW_GITHUB_RELEASE_FETCH: "0"
        run: |
          # Lean release gate: freeze/test the candidate. N-1 compatibility
          # is NOT part of the frozen acceptance contract and is not resolved
          # here (no published predecessor required).
          VERSION_INPUT="${{ inputs.version }}"
          case "$VERSION_INPUT" in
            v*) CERT_VERSION="$VERSION_INPUT" ;;
            *) CERT_VERSION="v$VERSION_INPUT" ;;
          esac
          export KIWI_ALLOW_SOURCE_N_MINUS_ONE=1
          ./scripts/certify-candidate.sh "$CERT_VERSION"
      - name: surface contracts
        run: |
          go run ./cmd/filemap --check
          ./scripts/docs-lint.sh --source --baseline scripts/docs-lint-baseline.txt
          ./scripts/docs-links-check.sh
      - name: push certified tag
        if: github.event_name == 'workflow_dispatch' && inputs.create_tag
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION_INPUT" in
            v*) VERSION="$VERSION_INPUT" ;;
            *) VERSION="v$VERSION_INPUT" ;;
          esac
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "version must look like v1.2.3" >&2
            exit 1
          }
          # certify-candidate.sh already tagged the FROZEN commit after the
          # gate passed. This step only publishes that tag.
          git push origin "$VERSION"
          echo "tag $VERSION pushed (frozen bytes already certified)"
