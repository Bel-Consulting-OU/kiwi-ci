# Native macOS/Windows CI.
#
# CI split (no duplicated lanes):
#   - Woodpecker CI (.woodpecker.yml) is the primary CI and owns EVERY Linux
#     lane: format, vet, unit/race on linux/amd64+linux/arm64, adversarial,
#     fuzz-smoke, schema, cross, docs, license, repro, staticcheck,
#     govulncheck, smoke, coverage, the PostgreSQL integration lane and the
#     rootless/hardened docker workspace lane.
#   - This single workflow exists only because Woodpecker cannot execute
#     non-Linux jobs. It runs the portable native checks on macOS and
#     Windows and nothing else; Linux jobs never belong here.
#
# Required status contexts (GitHub reports one check per matrix leg, named
# `<job name> (<matrix value>)`):
#   native (macos-latest)
#   native (windows-latest)
# scripts/gh-branch-protection.sh requires them in addition to the
# Woodpecker contexts; keep the job name and the matrix key in sync with it.
name: native

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      # The matrix key must stay `os`: it renders the required contexts
      # `native (macos-latest)` / `native (windows-latest)`.
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to full commit SHAs; Dependabot (.github/dependabot.yml)
      # raises the bump PRs deliberately.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The same selection as the Woodpecker `vet` lane, on native runners.
      - name: vet
        run: go vet ./...
      # The portable unit suite; -shuffle=on matches the Woodpecker lanes.
      - name: test
        run: go test -shuffle=on ./...
      # Race detection is macOS-only: it doubles the lane cost and the
      # linux/amd64 Woodpecker race lane already covers the race detector.
      - name: race
        if: runner.os == 'macOS'
        run: go test -race ./...
