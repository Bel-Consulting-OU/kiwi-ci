name: formal

# Scheduled formal-model regression: the TLA+ mirror is checked against TLC
# nightly (and on demand). It is deliberately NOT part of every push: the
# check needs Java and a downloaded tla2tools.jar, and the model only changes
# with lease/commit/retry/cancel semantics.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tlc:
    name: TLC kiwi_lease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: restore tla2tools.jar
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/kiwi/tla2tools.jar
          key: tla2tools-v1.7.4
      - name: fetch tla2tools.jar
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/kiwi
          curl -fsSL -o ~/.cache/kiwi/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      - name: model check
        run: |
          java -Xmx4g -jar ~/.cache/kiwi/tla2tools.jar -workers auto \
            -config formal/kiwi_lease.cfg formal/kiwi_lease.tla | tee tlc.log
          grep -q "Model checking completed. No error has been found" tlc.log
