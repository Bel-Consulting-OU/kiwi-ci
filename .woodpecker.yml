# Kiwi's own CI on Woodpecker CI (v3 pipeline syntax). Woodpecker is the
# primary and comprehensive CI for this repository: every lane below runs on
# push, pull request, manual and tag events; the nightly fuzz lane runs on the
# `nightly` cron job.
#
# CI split: Woodpecker owns EVERY Linux lane. Native macOS/Windows checks run
# in the single narrowly-scoped GitHub Actions workflow
# (.github/workflows/native.yml), because Woodpecker cannot execute non-Linux
# jobs; that workflow never duplicates a Linux lane.
#
# Schema notes (verified against the Woodpecker 3.18 pipeline JSON schema):
#   - `services` uses the map syntax: the map key is the service hostname.
#   - `matrix` is a TOP-LEVEL key; a platform matrix duplicates the whole
#     workflow per platform, so platform-independent lanes are pinned to
#     linux/amd64 with `when.platform`. The unit and race lanes intentionally
#     run on BOTH platforms.
#   - The arm64 matrix entry requires an agent registered with the
#     `platform=linux/arm64` label. Remove that entry when no arm64 agent
#     exists, otherwise its workflow stays queued forever. The amd64 entry
#     needs `platform=linux/amd64` (every Docker agent has it by default).
#   - `when` is a list of alternative conditions; all fields inside one entry
#     are ANDed. The top-level `when` admits cron pipelines as well: a
#     top-level filter that excluded `cron` would drop the nightly workflow
#     before its step could run.
#   - Woodpecker has no artifact store without an upload plugin; the coverage
#     step therefore prints the profile summary and enforces the floor, and
#     leaves coverage.out in the shared workspace.
#   - The `nightly` cron job (schedule `0 3 * * *`, branch main) is created in
#     the Woodpecker repository settings; the YAML below only filters on it.
#
# Status reporting: a single-file configuration is one workflow named after
# the file (`woodpecker`). Woodpecker reports one commit status per workflow
# leg, and with the DEFAULT status context configuration
# (WOODPECKER_STATUS_CONTEXT=ci/woodpecker,
# WOODPECKER_STATUS_CONTEXT_FORMAT={{ .context }}/{{ .event }}/{{ .workflow }}
# with a `/<axis_id>` suffix for matrix legs, axis ids starting at 1) this
# file produces
#   ci/woodpecker/push/woodpecker/1   (linux/amd64 leg)
#   ci/woodpecker/push/woodpecker/2   (linux/arm64 leg)
# on pushes and the corresponding /pr/ contexts on pull requests.
# scripts/gh-branch-protection.sh requires that documented set by default;
# instances that customize WOODPECKER_STATUS_CONTEXT(_FORMAT) must override
# it there (KIWI_WOODPECKER_CONTEXTS).

when:
  - event: [push, pull_request, manual, tag]
  - event: cron

labels:
  platform: ${platform}

matrix:
  platform:
    - linux/amd64
    - linux/arm64

# A shared /go volume keeps the module cache (and go run tool builds) warm
# across steps of one pipeline, which is what lets the pinned staticcheck and
# govulncheck steps reuse modules instead of re-downloading them per step.
workspace:
  base: /go

services:
  postgres:
    image: postgres:16-alpine
    when:
      - event: [push, pull_request, manual, tag]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: kiwi

steps:
  format:
    image: golang:1.27
    depends_on: []
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      - test -z "$(gofmt -l .)"

  vet:
    image: golang:1.27
    depends_on: [format]
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      - go vet ./...

  # unit and race run on every matrix platform: they are the portable core.
  unit:
    image: golang:1.27
    depends_on: []
    environment:
      GOTOOLCHAIN: local
    when:
      - event: [push, pull_request, manual, tag]
    commands:
      # -vet=all runs every vet analyzer over the test sources too; the
      # shuffle flag rotates test order per run so order-dependent state
      # leaks surface instead of hiding behind a stable sequence.
      - go test -vet=all -shuffle=on -timeout=15m ./...

  race:
    image: golang:1.27
    depends_on: []
    environment:
      GOTOOLCHAIN: local
    when:
      - event: [push, pull_request, manual, tag]
    commands:
      - go test -race -shuffle=on -timeout=15m ./...

  race-double:
    image: golang:1.27
    depends_on: [race]
    environment:
      GOTOOLCHAIN: local
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      # Repeat the race detector on the concurrency-critical packages: a
      # single pass misses schedules where a race only loses under a
      # different interleaving.
      - go test -race -count=2 -shuffle=on -timeout=25m ./internal/server ./internal/storage ./internal/scheduler ./internal/executor ./internal/runner ./internal/secretbroker ./internal/blob ./internal/safefs

  single-p:
    image: golang:1.27
    depends_on: [unit]
    environment:
      GOTOOLCHAIN: local
      GOMAXPROCS: "1"
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      # One OS thread: goroutine interleavings collapse, which is exactly
      # how the process-output loss race (Wait closing pipes before the
      # drains read them) was found. Never remove this lane.
      - go test -count=1 -timeout=30m ./...

  checkptr:
    image: golang:1.27
    depends_on: [unit]
    environment:
      GOTOOLCHAIN: local
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      # checkptr=2 is maximally strict about unsafe pointer arithmetic and
      # requires -race; it covers the syscall/unsafe paths (tui termios,
      # safefs openat handling) that plain vet cannot see.
      - go test -gcflags=all=-d=checkptr=2 -race -count=1 -timeout=40m ./...

  stress:
    image: golang:1.27
    depends_on: [unit]
    environment:
      GOTOOLCHAIN: local
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      # High-count concurrency/adversarial repetitions: races and
      # lost-update bugs need many interleavings, not one.
      - go test -run 'Concurrent|Property|Fault|HA|Parity|Adversarial' -count=10 -shuffle=on -timeout=30m ./internal/server ./internal/storage ./internal/scheduler ./internal/executor ./internal/runner

  adversarial:
    image: golang:1.27
    depends_on: [vet]
    environment:
      GOTOOLCHAIN: local
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      - go test -run 'Adversarial|Security|Property|Fault|Symlink|Traversal|Tamper|Reject|Evil|Bomb' -shuffle=on ./...

  fuzz-smoke:
    image: golang:1.27
    depends_on: [vet]
    environment:
      GOTOOLCHAIN: local
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      - ./scripts/fuzz-smoke.sh 30s

  schema:
    image: golang:1.27
    depends_on: [vet]
    environment:
      GOTOOLCHAIN: local
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      - go test -run Schema ./internal/pipeline
      - go run ./cmd/filemap --check

  cross:
    image: golang:1.27
    depends_on: [vet]
    environment:
      GOTOOLCHAIN: local
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      - make cross

  docs:
    image: golang:1.27
    depends_on: [vet]
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      - make docs-check

  license:
    image: golang:1.27
    depends_on: [vet]
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      - make license-check

  repro:
    image: golang:1.27
    depends_on: [vet]
    environment:
      GOTOOLCHAIN: local
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      - ./scripts/repro-build.sh

  staticcheck:
    image: golang:1.27
    depends_on: [vet]
    environment:
      GOTOOLCHAIN: local
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      # Pinned, never floating; the shared /go volume caches the tool build.
      # -checks=all with a curated exclusion list: ST1000/ST1020/ST1021
      # (package/type comment style) and ST1003 (initialism style) are
      # stylistic, everything else must be clean.
      - go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -checks=all,-ST1000,-ST1020,-ST1021,-ST1003 ./...

  govulncheck:
    image: golang:1.27
    depends_on: [vet]
    environment:
      GOTOOLCHAIN: local
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      # Needs network access to the vulnerability database; keep it online.
      # -test scans test dependencies as well: a vulnerable test-only path
      # is still a supply-chain finding.
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -test ./...

  smoke:
    image: golang:1.27
    depends_on: [vet]
    environment:
      GOTOOLCHAIN: local
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      # Container-free probe: build the real binary and validate both shipped
      # pipelines. `kiwi run` needs a container runtime, so it is exercised by
      # the executor test suites instead of here.
      - go build -trimpath -o /tmp/kiwi ./cmd/kiwi
      - /tmp/kiwi validate -f .kiwi/pipeline.yaml
      - /tmp/kiwi validate -f examples/kiwi.yaml

  coverage:
    image: golang:1.27
    depends_on: [unit, integration-postgres]
    environment:
      GOTOOLCHAIN: local
      KC_MIN_COVERAGE: "95"
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      - go test -coverprofile=coverage.out -covermode=atomic ./...
      # Assert both lanes' profiles before merging: a missing, empty,
      # header-less or truncated profile fails here with a clear message
      # instead of a confusing merge-coverage error.
      - ./scripts/ci-coverage-selftest.sh coverage.out integration-coverage.out
      # The integration lane wrote integration-coverage.out into the shared
      # workspace; merge so the real SQL paths count toward the total.
      - ./scripts/merge-coverage.sh merged-coverage.out coverage.out integration-coverage.out
      - ./scripts/coverage-report.sh merged-coverage.out
      - ./scripts/coverage-floor.sh merged-coverage.out

  integration-postgres:
    image: golang:1.27
    depends_on: [unit]
    environment:
      GOTOOLCHAIN: local
      KIWI_TEST_POSTGRES_URL: postgres://postgres:pass@postgres:5432/kiwi?sslmode=disable
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      # Wait for the postgres service without extra packages: a stdlib-only
      # Go dialer retries until the service accepts connections.
      - |
        cat > /tmp/wait-postgres.go <<'EOF'
        package main

        import (
        	"fmt"
        	"net"
        	"os"
        	"time"
        )

        func main() {
        	deadline := time.Now().Add(90 * time.Second)
        	for {
        		conn, err := net.DialTimeout("tcp", "postgres:5432", 2*time.Second)
        		if err == nil {
        			_ = conn.Close()
        			return
        		}
        		if time.Now().After(deadline) {
        			fmt.Fprintf(os.Stderr, "postgres not ready after 90s: %v\n", err)
        			os.Exit(1)
        		}
        		time.Sleep(time.Second)
        	}
        }
        EOF
        go run /tmp/wait-postgres.go
      # The coverage lane merges this profile with the unit profile, so it
      # must be written here with the same atomic mode and land in the shared
      # workspace as integration-coverage.out. -coverpkg=./... makes the
      # cross-package paths the integration tests drive (storage -> blob,
      # db, safefs, ...) count toward the merged total instead of only the
      # three target packages.
      - go test -count=1 -timeout=20m -v -run Integration -covermode=atomic -coverprofile=integration-coverage.out -coverpkg=./... ./internal/storage ./internal/scheduler ./internal/server

  # Hardened-container workspace lane. The integration test self-skips
  # unless KIWI_TEST_DOCKER=1; the preflight exports it only when this agent
  # actually exposes a usable docker daemon (CLI + socket), so agents without
  # one keep the pipeline green while still printing why the lane skipped.
  # Enable it on an agent by baking the docker CLI into the pipeline image
  # and mounting the daemon socket.
  docker-workspace:
    image: golang:1.27
    # REQUIRED lane on a Docker-capable agent: the rootless/hardened
    # workspace invariant had a production bug, so "Docker unavailable" is a
    # FAILURE here, not a skip. Agents without the label never run the step;
    # an agent with the label but no usable daemon fails it. Use the
    # self-skipping smoke variant below for best-effort environments.
    labels: [docker]
    depends_on: [unit]
    environment:
      GOTOOLCHAIN: local
      KIWI_TEST_DOCKER: "1"
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      - |
        if ! command -v docker >/dev/null 2>&1; then
          echo "required docker lane: docker CLI is not installed on this labeled agent" >&2
          exit 1
        fi
        if ! docker info >/dev/null 2>&1; then
          echo "required docker lane: no usable docker daemon (socket missing or permission denied)" >&2
          docker info >&2 || true
          exit 1
        fi
        go test -count=1 -v -timeout=20m -run RootlessHardenedContainerWorkspace ./internal/runner

  docker-workspace-smoke:
    image: golang:1.27
    # Best-effort companion lane: runs wherever a daemon happens to exist and
    # skips cleanly otherwise, so the invariant still gets exercised outside
    # the labeled production agent without making every agent a hard failure.
    depends_on: [unit]
    environment:
      GOTOOLCHAIN: local
    when:
      - event: [push, pull_request, manual, tag]
        platform: linux/amd64
    commands:
      - |
        if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
          export KIWI_TEST_DOCKER=1
          echo "docker daemon available: running the rootless/hardened workspace integration test (smoke)"
        else
          echo "smoke lane: no usable docker daemon on this agent; skipping"
        fi
        go test -count=1 -v -timeout=20m -run RootlessHardenedContainerWorkspace ./internal/runner

  # Nightly fuzz lane. Woodpecker cron jobs are created in the repository
  # settings (name `nightly`, schedule `0 3 * * *`, branch main); this step
  # only runs for that cron event and is skipped by every other pipeline.
  fuzz-nightly:
    image: golang:1.27
    depends_on: []
    environment:
      GOTOOLCHAIN: local
    when:
      - event: cron
        cron: nightly
        platform: linux/amd64
    commands:
      - ./scripts/fuzz-smoke.sh 30s
