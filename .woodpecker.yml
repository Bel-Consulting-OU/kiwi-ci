# Kiwi's own CI on Woodpecker CI. This pipeline is intentionally lean and
# fully green on every push: only gates that are hermetic and deterministic
# run here (the GitHub Actions matrix adds OS coverage and nightly fuzzing).
#
# Woodpecker executes each step in a fresh golang container; caching is
# declared per step for the module cache.

steps:
  format:
    image: golang:1.27
    commands:
      - test -z "$(gofmt -l .)"
    when:
      - event: [push, pull_request, manual]

  vet:
    image: golang:1.27
    commands:
      - go vet ./...

  unit:
    image: golang:1.27
    environment:
      GOTOOLCHAIN: local
    commands:
      - go test -shuffle=on -timeout=15m ./...

  race:
    image: golang:1.27
    commands:
      - go test -race -shuffle=on -timeout=15m ./...

  adversarial:
    image: golang:1.27
    commands:
      - go test -run 'Adversarial|Security|Property|Fault|Symlink|Traversal|Tamper|Reject|Evil|Bomb' -shuffle=on ./...

  schema:
    image: golang:1.27
    commands:
      - go test -run Schema ./internal/pipeline
      - go run ./cmd/filemap --check

  cross:
    image: golang:1.27
    commands:
      - make cross

  license:
    image: golang:1.27
    commands:
      - make license-check

  docs:
    image: golang:1.27
    commands:
      - make docs-check

  repro:
    image: golang:1.27
    commands:
      - ./scripts/repro-build.sh

  govulncheck:
    image: golang:1.27
    commands:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  staticcheck:
    image: golang:1.27
    commands:
      - go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
