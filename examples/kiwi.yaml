# yaml-language-server: $schema=../.kiwi/schema.json
#
# Kiwi self-test pipeline. Both jobs run in the golang container image,
# sandboxed (rootless, no network). The digest below is REAL: it is the exact
# golang:1.27 digest this project's CI pins and its self-hosted dogfooding
# pipeline (.kiwi/pipeline.yaml) uses, so jobs cannot be swapped by mutable
# image tags. Pin your own digest the same way before running against
# untrusted code.
version: 1
name: kiwi-self-test

defaults:
  shell: bash
  timeout: 10m
  retry:
    max: 1
    backoff: 1s

env:
  CGO_ENABLED: "0"
  GOCACHE: /kiwi/cache

concurrency:
  group: "${{ repo.full_name }}:${{ git.branch }}"
  cancel_in_progress: true

jobs:
  quality:
    runtime: container
    image: golang:1.27@sha256:f44f6e88636cfb311f9ebace870ded69d943f227bb3cb27d32ffd84ea18c43ea
    sandbox:
      rootless: true
      network: none
    steps:
      - name: format
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...

  test:
    needs: [quality]
    runtime: container
    image: golang:1.27@sha256:f44f6e88636cfb311f9ebace870ded69d943f227bb3cb27d32ffd84ea18c43ea
    sandbox:
      rootless: true
      network: none
    matrix:
      GO_VERSION: ["1.23"]
    cache:
      - name: go-cache
        key: "go-cache-${{ matrix.GO_VERSION }}"
        hash_files: [go.sum]
        paths:
          - .kiwi/cache
    steps:
      - name: test
        run: go test ./...
    artifacts:
      - name: source-snapshot
        if: failure()
        paths: ["*.md"]
