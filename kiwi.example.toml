# Kiwi CI server configuration
#
# Precedence: CLI flags > KIWI_* environment variables > this file > defaults.
# Every key is optional; defaults are documented per key. Keys left commented
# below are examples. At least one key is active in every section so that
# `kiwi config check --config kiwi.example.toml` (and `make docs-check`)
# actually exercises the strict parser against this file instead of validating
# a config with no keys at all.

[server]
# Public base URL advertised to runners, for OIDC issuer and forge statuses.
# Required and https:// in production mode.
external_url = "https://ci.example.com"

# HTTP listen address. Default ":8080".
listen = ":8080"

# TLS certificate and private key. Both must be set to enable HTTPS.
# tls_cert = "/etc/kiwi/server.crt"
# tls_key  = "/etc/kiwi/server.key"

# Server mode: "dev" (in-memory state, default) or "production".
# mode = "dev"

# Durable shared-cache manifest retention. Each unique (repo, key) manifest
# pins its referenced CAS blob, so rotated logical keys must not accumulate
# forever. Unset uses 30 days; "0" disables age pruning.
# cache_manifest_retention = "720h"
# Per-repository bounds; newest manifests are kept. Unset uses 4096 entries
# and 64 GiB; -1 disables that dimension (one repository can never consume
# another repository's accounting).
# max_cache_manifests_per_repo = 4096
# max_cache_manifest_bytes_per_repo = 68719476736

# Durable execution event stream retention. The oldest events are pruned as
# a contiguous prefix; a consumer cursor below the retained_from watermark
# is answered with HTTP 410 cursor_expired and must re-bootstrap via
# latest_cursor. Unset uses 7 days (168h); "0" disables retention.
# events_retention = "168h"

# CIDR ranges of reverse proxies in front of Kiwi. Only when the direct peer
# is inside one of these ranges is X-Forwarded-For honored (rightmost
# untrusted hop); otherwise the peer address is the rate-limit identity.
# Empty means X-Forwarded-For is never trusted.
# trusted_proxies = ["10.0.0.0/8", "192.168.0.0/16"]

[database]
# PostgreSQL connection URL; enables the durable SQL control plane.
url = "postgres://kiwi:secret@db:5432/kiwi"

# TOTAL PostgreSQL connection ceiling for Kiwi (all of its pools). The
# operational pool receives max_connections - 5 connections; the rest of the
# budget is a fixed 4-connection advisory-lock pool (CAS digest fences,
# collector lease) plus 1 reserved connection for the leader's leadership
# session. When set it must be at least 6. Default: driver default (no
# ceiling).
max_connections = 25

[runner_pki]
# Runner certificate enrollment and mTLS identity binding.
# enabled = true
# ca_cert = "/etc/kiwi/runner-ca.crt"
# ca_key  = "/etc/kiwi/runner-ca.key"

# Token authorizing POST /api/v1/runners/enroll.
enroll_token = "change-me"

[blob]
# Artifact blob storage backend: "fs" (local data dir, default) or "s3".
backend = "fs"
path = "/var/lib/kiwi/blobs"

# S3 settings, required when backend = "s3".
# s3_endpoint  = "https://s3.example.com"
# s3_bucket    = "kiwi-artifacts"
# s3_region    = "eu-central-1"
# s3_access_key = ""
# s3_secret_key = ""

# Path-style addressing (bucket in the URL path) instead of the default
# virtual-hosted style (bucket as the first host label). Required for IP
# endpoints, endpoints with a path prefix and buckets that are not
# DNS-compatible host labels.
# s3_path_style = false

# Explicit override allowing an http:// endpoint in production mode. S3
# requests carry SigV4 credentials, so production refuses plaintext
# transport unless this acknowledges a trusted network. Dev mode allows
# http:// for local gateways (MinIO and friends) without the override.
# s3_allow_plaintext = false

[staging]
# Bounded scratch space for large runner uploads (job cache entries and
# workspace snapshots) before they are published to the shared CAS. Large
# bodies spool here, never into an unbounded system temp directory, and
# concurrent uploads are charged against max_bytes before a byte is written.
#
# dir/max_bytes are all-or-nothing, and PRODUCTION MODE REFUSES TO START
# WITHOUT BOTH: without a bound, concurrent valid multi-GB uploads could
# exhaust the control-plane root filesystem. Pick a directory on a volume
# sized for at least a few concurrent maximum-size uploads, and a max_bytes
# budget that bounds the total in-flight staged bytes. In dev mode an unset
# section falls back to a bounded default under the server data dir.
dir = "/var/lib/kiwi/staging"
max_bytes = 34359738368

# Per-replica identity under dir (the ROOT, not the directory bytes land in):
# each process stages inside <dir>/<instance_id> and bounds only its own
# staged bytes. Optional; when unset the process generates one and persists it
# in dir. Replicas that share one dir MUST set distinct instance ids, and a
# second replica without its own id is refused at startup.
instance_id = "kiwi-1"

[github]
# GitHub App ID and private key for the API client. The pair is validated:
# app_id and private_key_path must be set together.
app_id = 12345
private_key_path = "/etc/kiwi/github.pem"

# Webhook HMAC secret and API token.
webhook_secret = "change-me"
token = "change-me"

[gitlab]
# GitLab instance root. Default https://gitlab.com; production requires
# https:// (plaintext http is allowed only for a loopback dev instance).
base_url = "https://gitlab.example.com"
webhook_secret = "change-me"
token = "change-me"

[forgejo]
# Forgejo/Gitea instance root. Default https://codeberg.org; production
# requires https:// (plaintext http is only for a loopback dev instance).
base_url = "https://codeberg.org"
webhook_secret = "change-me"
token = "change-me"

[policy]
# Repository/organization policy document (strict YAML, fail-closed).
file = "/etc/kiwi/policy.yaml"

# Optional OPA/Rego deny rules (fail-closed, in-process).
# opa_file = "/etc/kiwi/policy.rego"
# opa_rules = """
# package kiwi
# default allow := false
# allow if input.trusted
# deny contains "untrusted production" if {
#   not input.trusted
#   input.environment == "production"
# }
# """

[observability]
# OpenTelemetry collector endpoint (OTLP/HTTP): request spans and
# forge/enqueue/lease/completion traces are exported when set.
otel_endpoint = "https://otel.example.com:4318/v1/traces"

# Serve /metrics on a separate listen address when set.
metrics_listen = ":9090"

[rate_limit]
# Per-request rate limits, applied per principal / runner / client IP.
# 0 (the default) disables limiting.
per_second = 0

# Burst: instantaneous token budget before the per_second rate applies.
# Default 100.
burst = 100

# Per-class overrides (tokens/second); each falls back to per_second.
# next_per_second             = 0
# heartbeat_per_second        = 0
# logs_per_second             = 0
# artifact_upload_per_second  = 0
# cache_upload_per_second     = 0
# dispatch_per_second         = 0
# webhooks_per_second         = 0
# enroll_per_second           = 0
# register_per_second         = 0
# oidc_per_second             = 0
# secrets_per_second          = 0
# login_per_second            = 0

[auth]
# Admin bearer token (admin-tier API routes).
admin_token = "change-me"

# Runner bearer token shared by all runners. This is a SHARED credential
# without per-runner identity, so production refuses to rely on it: in
# production runner traffic must authenticate with per-runner mTLS
# certificates (runner_pki) or per-runner bearer tokens (runner_tokens_file
# below). Dev/bootstrap only.
# runner_token = ""

# JSON token-store path for fine-grained principals (auth.TokenStore format:
# a JSON object mapping the SHA-256 hex digest of a bearer token to its
# principal). Roles and repository permissions remain the primary RBAC
# grants; "capabilities" (all repositories) and "repository_capabilities"
# (per repository grant key, same r1:/a1:/owner/name schema as
# "repositories") are the fine-grained CONTROLLER grants for external
# consumers that must not hold admin:
#
#   execution.events:read  GET /api/v1/events + /events/stream: the unscoped
#                          cursor read requires a global grant; with a run_id
#                          a repository-scoped grant (or plain read access to
#                          that run's repository) suffices.
#   evidence:read          GET /api/v1/audit (global only: the trail spans
#                          repositories) and the exact-replay pipeline/payload
#                          export (run-scoped).
#   checkpoints:read       workspace snapshot listing and archive download
#                          (run-scoped).
#   runs:cancel            cancel a run (repo-scoped), like the cancel role.
#   graph.mutations:write  reserved for the future generic graph API; it is
#                          accepted and validated in this file but wires no
#                          route yet.
#
# A global capability (in "capabilities") is additive: a repository entry can
# only add capabilities, never take a global one away. Example controller
# principal ("<sha256 hex of its bearer token>" -> grants):
#
# {
#   "0123456789abcdef...": {
#     "subject": "faktor",
#     "capabilities": ["evidence:read"],
#     "repository_capabilities": {
#       "r1:Z2l0aHViLmNvbQ:YWNtZS9yZXBvLWE": ["checkpoints:read", "execution.events:read", "runs:cancel"]
#     }
#   }
# }
#
# tokens_file = "/etc/kiwi/tokens.json"

# JSON file of per-runner bearer credentials: maps a runner ID to the
# SHA-256 hex digest of that runner's token. In DB mode these are
# provisioned into the durable runner_bearer_tokens table at startup;
# in memory/fs mode they are kept in server memory.
# runner_tokens_file = "/etc/kiwi/runner-tokens.json"

[quota]
# Repository/team admission and cost budgets. 0 means unlimited, except that
# production requires at least one of repo_queue_depth/team_queue_depth to be
# positive: an unbounded queue lets any submitter grow the backlog without
# limit. The built-in default when the field is omitted is repo_queue_depth =
# 10000.
repo_concurrency = 0
team_concurrency = 0
repo_queue_depth = 10000
team_queue_depth = 0
daily_cost_limit = 0
daily_energy_limit = 0
fail_open = false

# Server-side resource ceilings applied to UNTRUSTED jobs at admission: an
# explicit request above a ceiling is rejected (400,
# untrusted_resource_ceiling_exceeded) before the run is signed or persisted,
# an unset dimension is filled with the ceiling, and trusted jobs are
# unconstrained. Memory and disk are plain byte counts; 0 disables that
# dimension. Defaults: 2 CPU, 4 GiB, 10 GiB, 256 PIDs. Overridable with the
# --untrusted-*-ceiling flags and the KIWI_QUOTA_UNTRUSTED_* environment
# variables.
untrusted_cpu_ceiling = 2                # cores
untrusted_memory_ceiling = 4294967296    # 4 GiB
untrusted_disk_ceiling = 10737418240     # 10 GiB
untrusted_pids_ceiling = 256

[scheduler]
# Bounded lease candidate scan (DB mode). One /next poll materializes at most
# max_candidate_rows queued candidates, requested in keyset pages of at most
# candidate_page_size (0 keeps the built-in defaults 256/4096). A successful
# scan that exhausts the row budget resumes from a fresh per-runner cursor on
# the next poll instead of re-scanning the same prefix. max_candidate_rows is
# capped at 100000 and values above it are rejected.
candidate_page_size = 256
max_candidate_rows = 4096

# reservation_wait delays a resource-blocked candidate from becoming the
# runner's reservation head, granting a grace period to backfill that already
# fits the runner. Empty/"0s" (the default) activates immediately.
# reservation_wait = "0s"

[secret_broker]
# Secret backend: "vault", "aws", "gcp", "azure", "onepassword" or "static"
# (empty disables secret resolution). Only the fields of the selected broker
# are required; a missing required field fails startup.
broker = "static"

# fallback_on lists the provider error classes that permit the broker chain to
# advance to the next configured broker (a static broker is appended as a
# fallback when static k=v entries are set). Absent defaults to
# ["not_found"]. Only "not_found" and "unavailable" are accepted:
# "unauthorized", "forbidden", "malformed" and unknown values are rejected at
# startup, because a chain must never mask an authorization, policy or
# security failure by delivering a later broker's secret. TLS/timeout/
# transport failures are "unavailable" (fail closed unless explicitly opted
# in here), and cancellation never falls back.
# fallback_on = ["not_found"]

# Vault: requires vault_addr; vault_token is optional.
# vault_addr = "https://vault.example.com:8200"
# vault_token = ""

# AWS Secrets Manager: requires aws_region; the access key, secret key and
# session token are optional (the default credential chain is used when
# unset).
# aws_region = "eu-central-1"
# aws_access_key = ""
# aws_secret_key = ""
# aws_token = ""

# GCP Secret Manager: requires gcp_project and gcp_credentials (the path to a
# service-account JSON credentials file).
# gcp_project = "my-project"
# gcp_credentials = "/etc/kiwi/gcp-credentials.json"

# Azure Key Vault: requires azure_tenant, azure_client_id,
# azure_client_secret and azure_vault_url.
# azure_tenant = "tenant-id"
# azure_client_id = "client-id"
# azure_client_secret = ""
# azure_vault_url = "https://my-vault.vault.azure.net"

# 1Password Connect: requires onepassword_host, onepassword_token and
# onepassword_vault.
# onepassword_host = "https://connect.example.com"
# onepassword_token = ""
# onepassword_vault = "ci"

# Static broker: comma-separated k=v entries served in-process.
static = "DEPLOY_KEY=value"

[components]
# Server-side component resolution: a local directory registry and/or a remote
# registry HTTP API (remote_url requires https:// and remote_token is its
# bearer credential).
registry_dir = "/etc/kiwi/components"
# remote_url = "https://components.example.com"
# remote_token = ""
